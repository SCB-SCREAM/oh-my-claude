version: 2

project_name: omc

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: omc
    main: ./cmd/omc
    binary: omc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/SCB-SCREAM/oh-my-claude/internal/version.Version={{.Version}}
      - -X github.com/SCB-SCREAM/oh-my-claude/internal/version.Commit={{.ShortCommit}}
      - -X github.com/SCB-SCREAM/oh-my-claude/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: omc
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archive-sboms
    artifacts: archive

signs:
  - id: cosign-checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--bundle=${artifact}.sigstore.json"
      - "--yes"
      - "${artifact}"
    output: true

homebrew_casks:
  - name: omc
    binary: omc
    repository:
      owner: SCB-SCREAM
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/SCB-SCREAM/oh-my-claude"
    description: "Bootstrap Claude Code for your project, opinionated by stack"
    license: MIT
    # Cask binaries on macOS get quarantined by Gatekeeper; clear the xattr
    # on install so users don't have to right-click → open the first time.
    hooks:
      post:
        install: |
          if OS.mac? && Hardware::CPU.arm?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/omc"]
          end

scoops:
  - repository:
      owner: SCB-SCREAM
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://github.com/SCB-SCREAM/oh-my-claude"
    description: "Bootstrap Claude Code for your project, opinionated by stack"
    license: MIT

release:
  draft: false
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  use: github-native
