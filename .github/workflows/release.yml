name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write    # create the GitHub Release
  id-token: write    # OIDC token for cosign keyless signing
  packages: write    # for OCI artifacts (future)

defaults:
  run:
    shell: bash

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser reads full git history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set these in repo secrets to auto-publish to the
          # respective tap / bucket. Without them goreleaser will skip the
          # publish step for that target rather than fail.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
